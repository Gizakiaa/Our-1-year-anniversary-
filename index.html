<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy 1 Year Zain 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#ffe6f0;
      --bg2:#0b0b0f;
      --accent1:#ff4d94;
      --accent2:#7b6cff;
      --accent3:#4da6ff;
      --accent4:#ff6666;
      --glass: rgba(255,255,255,0.06);
      --maxw:1100px;
      color-scheme: light;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(160deg,var(--bg1),#efe6ff 40%, #e8f7ff 90%);}
    .wrap{max-width:var(--maxw);margin:28px auto;padding:24px}
    header{display:flex;align-items:center;gap:18px}
    .logo{width:84px;height:84px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:white;box-shadow:0 8px 30px rgba(123,108,255,0.18)}
    h1{margin:0;font-size:28px}
    .sub{color:#222;opacity:0.8;margin-top:6px}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:20px;margin-top:20px}
    .card{background:rgba(255,255,255,0.9);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(16,24,40,0.06)}
    .small{font-size:13px;color:#444}

    .hero{display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.85));}
    .names{display:flex;gap:10px;align-items:center}
    .name-bubble{padding:8px 12px;border-radius:999px;font-weight:700}
    .zain{background:linear-gradient(90deg,var(--accent2),var(--accent1));color:white}
    .bray{background:linear-gradient(90deg,var(--accent3),var(--accent4));color:white}

    .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .thumb{position:relative;border-radius:10px;overflow:hidden;background:#f3f3f3;min-height:80px}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .caption{position:absolute;left:0;bottom:0;padding:6px 8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.5));color:white;font-size:13px;width:100%}

    label.upload{display:inline-block;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:white;font-weight:600;cursor:pointer}
    input[type=file]{display:none}

    .editable{min-height:64px;padding:10px;border-radius:10px;border:1px dashed rgba(0,0,0,0.06);background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0.5))}
    @media (max-width:900px){
      .grid{grid-template-columns:1fr;}
      .gallery-grid{grid-template-columns:repeat(2,1fr)}
    }

    footer{margin-top:18px;text-align:center;color:#333;opacity:0.9}
    .tiny{font-size:12px;color:#666}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">1Y</div>
      <div>
        <h1 id="title">Happy 1 Year, Zain ❤️</h1>
        <div class="sub">From Brayden</div>
      </div>
    </header>

    <div class="grid">
      <main>
        <section class="card hero">
          <div class="names">
            <div class="name-bubble zain">Zain</div>
            <div style="flex:1"></div>
            <div class="name-bubble bray">Brayden</div>
          </div>
          <div class="small">You're everything to me</div>
          <div style="margin-top:12px">
            <div contenteditable="true" id="heroMessage" class="editable">Zain one year of laughs, late-night chats, and endless support. I love you more every day.</div>
          </div>
        </section>

        <section class="card" style="margin-top:18px">
          <h3>Gallery / Photos</h3>

          <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
            <label class="upload">+ Add photos<input id="photoInput" type="file" accept="image/*" multiple></label>
            <button id="clearGallery" class="upload" style="background:linear-gradient(90deg,var(--accent3),var(--accent2))">Clear gallery</button>
          </div>

          <div id="gallery" class="gallery-grid" style="margin-top:12px"></div>
        </section>

        <section class="card" style="margin-top:18px">
          <h3>Letter to Zain</h3>
          <textarea id="letter" class="editable" style="width:100%;min-height:140px;margin-top:8px;padding:12px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);">Dear Zain,

Happy 1 year! ...</textarea>
        </section>
      </main>

      <aside>
        <div class="card">
          <h4>Just a note</h4>
          <ul class="small">
            <li>I</li>
            <li>love</li>
            <li>you</li>
          </ul>
        </div>
      </aside>
    </div>

    <footer>
      <div class="tiny">Made with love by Brayden 💜</div>
    </footer>
  </div>

  <script>
    const gallery = document.getElementById("gallery");
    const input = document.getElementById("photoInput");
    const clearGallery = document.getElementById("clearGallery");

    function addThumb(dataUrl){
      const wrap = document.createElement("div");
      wrap.className="thumb";

      const img = document.createElement("img");
      img.src = dataUrl;

      const cap = document.createElement("div");
      cap.className="caption";
      cap.contentEditable = true;
      cap.innerText = "Tap to caption";

      wrap.appendChild(img);
      wrap.appendChild(cap);
      gallery.appendChild(wrap);
    }

    input.addEventListener("change", async (e)=>{
      const files = Array.from(e.target.files).slice(0,24);
      for(const f of files){
        const data = await fileToDataUrl(f);
        addThumb(data);
      }
      input.value="";
    });

    function fileToDataUrl(file){
      return new Promise(res=>{
        const r=new FileReader();
        r.onload=()=>res(r.result);
        r.readAsDataURL(file);
      });
    }

    clearGallery.addEventListener("click",()=>{
      if(confirm("Clear all photos?")) gallery.innerHTML="";
    });
  </script>
</body>
</html>
